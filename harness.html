<!--
  Local verification harness — NOT the app. index.html is.

  Loads the real app modules but replaces Google sign-in and the Apps Script
  backend with harness-stub.js: an in-memory ledger of fake bills answering on a
  deliberate 2000ms delay (the measured Apps Script floor). It cannot reach the
  live Sheet, holds no credentials, and shows no real data — so it is harmless
  even though GitHub Pages serves it.

  Exists because the perceived-latency work (offline cache, focus staleness
  gate, optimistic writes) is only observable against a slow backend, and the
  real one cannot be driven from localhost — the OAuth origin is the Pages
  domain. Drive it with scripts/verify-perf.mjs.
-->

          z-index: 9999; pointer-events: none; }
    #hz b { color: #ff0; }
  </style>
</head>
